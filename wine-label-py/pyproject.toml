[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "winelabel"
version = "0.1.0"
description = "Wine label OCR prototype: PP-OCR (ONNX) + field parser"
requires-python = ">=3.10"
dependencies = [
    "rapidocr>=3.10",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.8",
    "numpy>=1.26",
    "pillow>=10.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
winelabel = "winelabel.cli:main"

[tool.setuptools]
packages = ["winelabel"]

[tool.setuptools.package-data]
winelabel = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
